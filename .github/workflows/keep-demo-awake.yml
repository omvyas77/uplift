name: keep-demo-awake

# Free Hugging Face Spaces sleep after ~48h of inactivity, and a sleeping Space
# shows "Restart this Space" instead of the dashboard - so the link in the
# README is dead on arrival for anyone who opens it on a quiet week. This pings
# it well inside that window.
#
# One HEAD request every 12 hours is ~60 requests a month, which is negligible
# load and is the intended way to keep a demo reachable.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping the Space
        run: |
          set -euo pipefail
          URL="https://omvyas77-uplift.hf.space/_stcore/health"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" -L --max-time 60 "$URL" || echo 000)
            body=$(cat /tmp/body 2>/dev/null || true)
            echo "attempt $attempt: HTTP $code, body: ${body:0:40}"
            if [ "$code" = "200" ] && [ "$body" = "ok" ]; then
              echo "Space is awake."
              exit 0
            fi
            # A sleeping Space returns non-200 until the container is back up.
            sleep 30
          done
          echo "::warning::Space did not report healthy after 6 attempts"
          # Do not fail the build: a transient HF outage should not show up as a
          # red X on the repo. The warning is the signal.
          exit 0
