version: 2

sources:
  - name: raw
    schema: main
    description: >
      Criteo Uplift Prediction Dataset v2.1 (13,979,592 rows), assembled from
      randomized incrementality trials. Loaded by `uplift ingest`, not by dbt.

      DESCRIPTIONS ONLY, NO TESTS - deliberately. On the `ci` target this source
      is substituted for the committed 50k-row seed (see the `raw_units()`
      macro), so the table does not exist there and source tests ERROR rather
      than run. That is exactly what happened: 10 source tests failed on every
      CI build. The identical assertions live on `stg_criteo__units`, which is
      built on BOTH targets, so coverage is unchanged and now actually executes.
    tables:
      - name: units
        description: One row per randomized unit.
        columns:
          - name: unit_id
            description: Stable surrogate key assigned once at ingestion and persisted to Parquet.
          - name: treatment
            description: Randomized assignment. THE instrument / the experiment.
          - name: exposure
            description: >
              POST-TREATMENT. Whether an ad was actually served. Never use as a
              feature or a filter; conditioning on it breaks randomization and
              inflates the effect. Used only as the compliance indicator for the
              CACE / instrumental-variables estimand.
          - name: visit
            description: Primary outcome. Base rate ~4.7%.
          - name: conversion
            description: >
              Secondary outcome. Base rate ~0.29%; too rare for stable uplift
              ranking, so it is reported as a guardrail, never as the objective.
