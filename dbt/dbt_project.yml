name: uplift
version: "1.0.0"
config-version: 2
profile: uplift

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Loosened on the `ci` target, where the 50k seed cannot support the tight
  # tolerances the full 14M-row table can. Overridden via --vars.
  smd_tolerance: 0.02            # WARN level: what a clean RCT should satisfy
  smd_blocking_tolerance: 0.10   # ERROR level: the matching-literature rule of thumb
  treatment_ratio_tolerance: 0.005
  split_tolerance: 0.01

models:
  uplift:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  uplift:
    criteo_sample:
      +column_types:
        unit_id: BIGINT
        treatment: TINYINT
        exposure: TINYINT
        visit: TINYINT
        conversion: TINYINT
